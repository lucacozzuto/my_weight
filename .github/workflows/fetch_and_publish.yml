name: Fetch Garmin Weight & Deploy Dashboard

on:
  schedule:
    # Run every morning at 06:00, 07:00, 08:00, and 09:00 UTC
    # This covers morning weigh-ins across various timezones (e.g., 7:00-10:00 CET/CEST)
    - cron: '0 6,7,8,9 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - 'README.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Garmin Data & Generate Dashboard
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_START_DATE: ${{ vars.GARMIN_START_DATE || '2026-09-01' }}
          GARMIN_TARGET_WEIGHT: ${{ vars.GARMIN_TARGET_WEIGHT || '' }}
        run: |
          python scripts/fetch_garmin_data.py

      - name: Commit updated data and dashboard
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: update weight history and dashboard [skip ci]"
          file_pattern: "data/* docs/*"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
