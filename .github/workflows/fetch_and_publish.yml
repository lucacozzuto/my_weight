name: Fetch Garmin Weight & Deploy Protected Dashboard

on:
  schedule:
    # Orari italiani: 07:54, 08:03, 08:14 (copre sia ora legale CEST UTC+2 sia ora solare CET UTC+1)
    - cron: '54 5 * * *'  # 07:54 CEST
    - cron: '3 6 * * *'   # 08:03 CEST
    - cron: '14 6 * * *'  # 08:14 CEST
    - cron: '54 6 * * *'  # 07:54 CET
    - cron: '3 7 * * *'   # 08:03 CET
    - cron: '14 7 * * *'  # 08:14 CET
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - 'README.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Garmin Data & Encrypt Dashboard
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS_BASE64: ${{ secrets.GARMIN_TOKENS_BASE64 }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          GARMIN_START_DATE: ${{ vars.GARMIN_START_DATE || '2026-09-01' }}
          GARMIN_TARGET_WEIGHT: ${{ vars.GARMIN_TARGET_WEIGHT || '' }}
        run: |
          python scripts/fetch_garmin_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated: update encrypted weight history and dashboard [skip ci]"
            git push origin main || {
              git fetch origin main
              git reset --soft origin/main
              git add data/ docs/
              git commit -m "Automated: update encrypted weight history and dashboard [skip ci]"
              git push origin main
            }
          fi

      - name: Setup Pages
        id: setup-pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.setup-pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        if: steps.setup-pages.outcome == 'success'
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
